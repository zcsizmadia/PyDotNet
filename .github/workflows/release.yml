name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel releases in progress

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release
    # This ensures the job only runs if the tag was created from the main branch
    if: github.event.release.target_commitish == 'main'
    permissions:
      actions: read        # To download from build.yml
      contents: write      # To upload assets to the Release
      packages: write      # To push to GitHub Packages
      id-token: write      # To sign the build provenance attestation
      attestations: write  # To record it against the repository

    steps:
      # Check out the tagged commit itself, not the branch tip, so the SHA resolved below
      # is the one being released.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Resolve the tagged commit
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "TAG_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Releasing ${{ github.event.release.tag_name }} -> $SHA"

      # Pinned to the tagged commit rather than "the newest successful build on main".
      #
      # Without `commit`, this resolves to the latest successful run that happens to carry
      # the artifact, which is not necessarily the commit being released. Publishing while
      # the tagged commit was still building would therefore ship binaries from an earlier
      # commit under the new tag — a silent mismatch, since the version check below only
      # compares the tag against Directory.Build.props and both would agree.
      #
      # If the tagged commit has not finished building, this step fails rather than
      # publishing the wrong bits. Re-run the release job once its build is green.
      - name: Download nuget packages from build workflow
        uses: dawidd6/action-download-artifact@v23
        with:
          workflow: build.yml
          workflow_conclusion: success
          commit: ${{ env.TAG_SHA }}
          name: nuget-packages
          path: ./nupkgs
          check_artifacts: true    # Ensures the workflow actually has the named artifact
          search_artifacts: true   # Finds the run that actually contains this artifact

      - name: Check nupkg version
        shell: bash
        run: |
          # Get version from the tag (stripping 'v' prefix if present)
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"

          echo "Validating version: $TAG_VERSION"

          # Extract version from csproj
          PROJECT_VERSION="$(dotnet msbuild src/PyDotNet/ -getProperty:Version -nologo -v:q | tr -d '\r' | xargs)"

          # Check if the tag version matches the project version
          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "::error::Version mismatch! Tag ($TAG_VERSION) != Project ($PROJECT_VERSION)"
            exit 1
          fi

          # The package list is derived from src/, the same source the pack step in
          # build.yml uses, rather than written out here. A hardcoded list has to be
          # remembered when a plugin is added — PyDotNet.LangChain is already announced as
          # planned — and forgetting it means the new package silently never ships.
          TARGET_NUPKGS=$(
            for proj in src/*/; do
              basename "$proj"
            done | sort | tr '\n' ' '
          )

          if [[ -z "${TARGET_NUPKGS// }" ]]; then
            echo "::error::No packable projects found under src/."
            exit 1
          fi

          echo "Packages to publish: $TARGET_NUPKGS"

          # Every project under src/ must have produced a package for this version. A
          # missing one means the build packed a different set than the repository holds.
          for NUPKG in $TARGET_NUPKGS; do
            NUPKG_FILE="./nupkgs/$NUPKG.$TAG_VERSION.nupkg"
            if [[ ! -f "$NUPKG_FILE" ]]; then
              echo "::error::Could not find $NUPKG_FILE in downloaded artifacts"
              exit 1
            fi
          done

          # And nothing may be published that src/ does not account for.
          for FILE in ./nupkgs/*.nupkg; do
            NAME=$(basename "$FILE" ".$TAG_VERSION.nupkg")
            if [[ " $TARGET_NUPKGS " != *" $NAME "* ]]; then
              echo "::error::Artifact contains $NAME, which is not a project under src/."
              exit 1
            fi
          done

          # Export variables for later steps
          echo "TARGET_NUPKGS=$TARGET_NUPKGS" >> $GITHUB_ENV
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV

      # Records where these exact files came from — which workflow, which commit, which
      # run — and signs it. Anyone can then verify a downloaded package was built here and
      # not substituted, with `gh attestation verify <file> --repo zcsizmadia/PyDotNet`.
      #
      # Runs before publishing so nothing reaches NuGet without provenance. It covers the
      # artifact that was verified against the tag in the step above, so the attested files
      # are the ones actually pushed.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'nupkgs/*.nupkg'

      - name: Attach Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for NUPKG in $TARGET_NUPKGS; do
            gh release upload ${{ github.event.release.tag_name }} "./nupkgs/$NUPKG.$TAG_VERSION.nupkg" --clobber
          done

      - name: Publish to NuGet.org
        shell: bash
        run: |
          for NUPKG in $TARGET_NUPKGS; do
            dotnet nuget push "./nupkgs/$NUPKG.$TAG_VERSION.nupkg" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Publish to GitHub Packages
        run: |
          for NUPKG in $TARGET_NUPKGS; do
            dotnet nuget push "./nupkgs/$NUPKG.$TAG_VERSION.nupkg" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --skip-duplicate
          done
