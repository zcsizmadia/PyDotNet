name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

        include:
          - os: ubuntu-latest
            python-version: '3.14'
            pack-nupkg: true

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.os }} - Python ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          update-environment: true

      - name: Install packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # polars-lts-cpu has x86_64 wheels only; fall back to polars on ARM64.
          python -m pip install numpy pandas pyarrow torch matplotlib
          pip install polars-lts-cpu || pip install polars

      - name: Build
        shell: bash
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Test
        shell: bash
        run: |
          dotnet test -c Release --no-build

      - name: Run samples
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          for proj in samples/*/; do
            echo "--- Running $(basename "$proj") ---"
            dotnet run -c Release --no-build --project "$proj"
          done

      - name: Pack 
        if: matrix.pack-nupkg == true
        shell: bash
        run: |
          for proj in src/*/; do
            echo "--- Packing $(basename "$proj") ---"
            dotnet pack -c Release --no-build -o nupkgs "$proj"
          done

      - name: Upload NuGet packages
        if: matrix.pack-nupkg == true
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            nupkgs/*.nupkg

  coverage:
    runs-on: ubuntu-latest
    name: Coverage - Ubuntu - Python 3.14 - .NET 10

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          update-environment: true

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow torch matplotlib
          pip install polars-lts-cpu || pip install polars

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore

      - name: Build coverage target
        run: dotnet build -c Release -f net10.0 --no-restore

      - name: Collect coverage
        shell: pwsh
        run: ./eng/Collect-Coverage.ps1 -NoBuild

      - name: Publish coverage summary
        shell: pwsh
        run: |
          [xml] $report = Get-Content coverage/coverage.cobertura.xml
          $line = [math]::Round(([double] $report.coverage.'line-rate') * 100, 2)
          $branch = [math]::Round(([double] $report.coverage.'branch-rate') * 100, 2)
          "## Code coverage`n`n- Lines: **$line%**`n- Branches: **$branch%**" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cobertura
          path: coverage/coverage.cobertura.xml
