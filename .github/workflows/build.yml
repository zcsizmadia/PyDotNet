name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64).
        #
        # Intel macOS (macos-15-intel) is deliberately not covered: PyTorch no longer
        # publishes macOS x86_64 wheels. On Python 3.13/3.14 none exist at all, and on
        # 3.11/3.12 pip resolves a stale 2.2.x wheel built against NumPy 1.x, which then
        # fails with "Numpy is not available". Pinning numpy<2 for that platform alone
        # would diverge its test environment from every other job, and PyDotNet.Torch
        # cannot work there regardless.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

        include:
          - os: ubuntu-latest
            python-version: '3.14'
            pack-nupkg: true

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.os }} - Python ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          update-environment: true

      - name: Install packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # polars-lts-cpu has x86_64 wheels only; fall back to polars on ARM64.
          python -m pip install numpy pandas pyarrow torch matplotlib
          pip install polars-lts-cpu || pip install polars

      - name: Build
        shell: bash
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      # Coverage is collected on one leg only. It is the same test run either way, so
      # measuring everywhere would multiply the cost by sixteen for identical numbers.
      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.pack-nupkg }}" = "true" ]; then
            dotnet test -c Release --no-build -- --coverage --coverage-output-format cobertura
          else
            dotnet test -c Release --no-build
          fi

      - name: Summarise coverage
        if: matrix.pack-nupkg == true
        shell: bash
        run: |
          # One report per test assembly per target framework, so there are more than twenty.
          # They are summed rather than sampled: taking any single report's line-rate reports
          # one assembly's view as if it were the whole project, which is off by a factor of
          # two or three and looks authoritative while being wrong.
          #
          # lines-covered and lines-valid sit on each report's root element, so the aggregate
          # needs no report-generator dependency.
          REPORTS=$(find TestResults -name '*.cobertura.xml' | wc -l)

          if [ "$REPORTS" -eq 0 ]; then
            echo "::error::Coverage was requested but no cobertura report was produced."
            exit 1
          fi

          read -r COVERED VALID < <(
            find TestResults -name '*.cobertura.xml' -exec \
              sed -n 's/.*lines-covered="\([0-9]*\)".*lines-valid="\([0-9]*\)".*/\1 \2/p' {} \; \
            | awk '{ c += $1; v += $2 } END { print c, v }'
          )

          if [ -z "$VALID" ] || [ "$VALID" -eq 0 ]; then
            echo "::error::Coverage reports contained no measurable lines."
            exit 1
          fi

          PERCENT=$(awk "BEGIN { printf \"%.1f\", $COVERED / $VALID * 100 }")

          echo "Line coverage: ${PERCENT}% ($COVERED/$VALID lines across $REPORTS reports)"
          {
            echo "### Coverage"
            echo ""
            echo "Line coverage **${PERCENT}%** — $COVERED of $VALID lines, aggregated over $REPORTS reports."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.pack-nupkg == true
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/*.cobertura.xml

      # The benchmarks back the latency table in the README and are built by CI as part of
      # the solution, but nothing ever ran them — so a benchmark that compiles and then
      # throws would go unnoticed until someone tried to reproduce the numbers.
      #
      # --list flat covers discovery across every benchmark, including the pythonnet
      # comparisons; the dry run then executes PyDotNet's own once each. Filtering keeps
      # pythonnet's separate interpreter configuration out of the build's critical path.
      - name: Smoke-run benchmarks
        if: matrix.pack-nupkg == true
        shell: bash
        run: |
          LISTED=$(dotnet run --project benchmarks/PyDotNet.Benchmarks -c Release --no-build -- --list flat \
                   | grep -c 'PyDotNet.Benchmarks.Benchmarks' || true)

          if [ "$LISTED" -eq 0 ]; then
            echo "::error::No benchmarks were discovered."
            exit 1
          fi

          echo "Discovered $LISTED benchmarks."

          dotnet run --project benchmarks/PyDotNet.Benchmarks -c Release --no-build -- \
            --job Dry --filter '*PyDotNetBenchmarks*'

      # CPython reads the program name only during Py_Initialize(), so a virtual
      # environment can be activated at most once per process. This runs the activation
      # test on its own, in a dedicated process, against a purpose-built environment.
      # The marker module is written straight into site-packages rather than pip-installed
      # so that it cannot also be present in the base interpreter.
      - name: Test virtual environment activation
        shell: bash
        run: |
          VENV="${RUNNER_TEMP}/pydotnet-test-venv"
          python -m venv "$VENV"
          if [ -d "$VENV/Scripts" ]; then VENV_PY="$VENV/Scripts/python.exe"; else VENV_PY="$VENV/bin/python"; fi
          SITE_PACKAGES=$("$VENV_PY" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "MARKER = 'pydotnet'" > "$SITE_PACKAGES/pydotnet_venv_marker.py"

          # Confirm the marker is genuinely absent from the base interpreter, so that a
          # successful import can only have come from the virtual environment.
          if python -c "import pydotnet_venv_marker" 2>/dev/null; then
            echo "::error::Marker module leaked into the base interpreter; the test would prove nothing."
            exit 1
          fi

          PYDOTNET_TEST_VENV="$VENV" dotnet test tests/PyDotNet.Lifecycle.Tests -c Release --no-build \
            -- --treenode-filter "/*/*/VirtualEnvironmentActivation/*"

      # The isolation flags are likewise consumed once, by Py_Initialize(), so this also
      # needs a process of its own.
      - name: Test interpreter isolation
        shell: bash
        env:
          PYDOTNET_TEST_ISOLATION: "1"
        run: |
          dotnet test tests/PyDotNet.Lifecycle.Tests -c Release --no-build \
            -- --treenode-filter "/*/*/IsolationActivation/*"

      # sys.path is arranged once, during initialization, and these tests each configure it
      # differently, so every one needs its own process. That rules out the single
      # class-wildcard filter the neighbouring gated steps use.
      #
      # The list is discovered rather than written out. Hardcoded names meant a test added
      # to this class ran nowhere: the unfiltered Test step skips it (the gate variable is
      # unset) and a fixed loop never named it, so CI stayed green while covering nothing.
      - name: Test sys.path placement
        shell: bash
        env:
          PYDOTNET_TEST_SYSPATH: "1"
        run: |
          cd tests/PyDotNet.Lifecycle.Tests

          TESTS=$(dotnet run -c Release --no-build -f net10.0 -- \
                    --list-tests --treenode-filter "/*/*/SysPathPlacementTests/*" \
                  | sed -n 's/^  \([A-Za-z_][A-Za-z0-9_]*\)$/\1/p')

          if [ -z "$TESTS" ]; then
            echo "::error::Discovered no SysPathPlacementTests. The filter or the class name has changed."
            exit 1
          fi

          echo "Discovered:"; echo "$TESTS" | sed 's/^/  /'

          for test in $TESTS; do
            echo "--- $test ---"
            dotnet test -c Release --no-build -- --treenode-filter "/*/*/SysPathPlacementTests/$test"
          done

      - name: Run samples
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          for proj in samples/*/; do
            echo "--- Running $(basename "$proj") ---"
            dotnet run -c Release --no-build --project "$proj"
          done

      - name: Pack 
        if: matrix.pack-nupkg == true
        shell: bash
        run: |
          for proj in src/*/; do
            echo "--- Packing $(basename "$proj") ---"
            dotnet pack -c Release --no-build -o nupkgs "$proj"
          done

      - name: Upload NuGet packages
        if: matrix.pack-nupkg == true
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            nupkgs/*.nupkg
            # Symbol packages must travel with their .nupkg: the release workflow pushes
            # from this artifact, and `dotnet nuget push` only forwards a .snupkg when it
            # sits alongside the package it belongs to.
            nupkgs/*.snupkg

  # Python 3.15 is still a release candidate (final: 2026-10-01), so it is kept out of the
  # matrix above and cannot fail the build. Two reasons, both temporary:
  #
  #   * Third-party wheels lag a new release. At 3.15.0rc2 numpy and polars are available
  #     but pandas, pyarrow, matplotlib and torch are not, so the plugin test projects
  #     cannot run at all. For 3.14 the last of these (pyarrow) landed 17 days after the
  #     final release, so the wait here is likely to outlast 3.15 GA on 2026-10-01.
  #   * A release candidate can change under us, and that should not block an unrelated
  #     pull request.
  #
  # What it does cover is exactly what changes between versions: interpreter configuration.
  # 3.15 removed Py_SetProgramName and the isolation globals from the headers, so this job
  # is what proves PyDotNet still initializes, activates a virtual environment, and applies
  # isolation there — via PyInitConfig (PEP 741) rather than the legacy symbols.
  #
  # Promote this into the matrix once 3.15 is final and the wheels have caught up.
  prerelease:
    runs-on: ubuntu-latest
    name: Build - Python 3.15 (prerelease, informational)
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Set up Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
          update-environment: true

      # Nothing below this point needs a third-party package: the lifecycle suite depends
      # only on the standard library. This step exists purely to record when the ecosystem
      # has caught up enough for 3.15 to join the matrix.
      #
      # --only-binary and --dry-run are load-bearing, not tidiness. Without them pip
      # responds to a missing wheel by fetching the sdist and building it — pyarrow and
      # matplotlib are large C++ builds and torch is enormous — or by backtracking through
      # hundreds of releases hunting for a compatible one. Either takes tens of minutes.
      # The timeout is a backstop in case a future pip finds another way to be slow.
      - name: Report interpreter and wheel availability
        shell: bash
        run: |
          python -VV
          python -m pip install --upgrade pip

          for pkg in numpy pandas polars pyarrow matplotlib torch; do
            if timeout 90 python -m pip install --only-binary=:all: --dry-run --quiet "$pkg" 2>/dev/null; then
              echo "  available  $pkg"
            else
              echo "  missing    $pkg (no 3.15 wheel yet)"
            fi
          done

      - name: Build
        shell: bash
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      # Only the lifecycle project runs. It depends on nothing beyond the standard library,
      # so a failure here is a genuine incompatibility rather than a missing wheel.
      - name: Test interpreter lifecycle
        shell: bash
        run: |
          dotnet test tests/PyDotNet.Lifecycle.Tests -c Release --no-build

      - name: Test virtual environment activation
        shell: bash
        run: |
          VENV="${RUNNER_TEMP}/pydotnet-test-venv"
          python -m venv "$VENV"
          VENV_PY="$VENV/bin/python"
          SITE_PACKAGES=$("$VENV_PY" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "MARKER = 'pydotnet'" > "$SITE_PACKAGES/pydotnet_venv_marker.py"

          if python -c "import pydotnet_venv_marker" 2>/dev/null; then
            echo "::error::Marker module leaked into the base interpreter; the test would prove nothing."
            exit 1
          fi

          PYDOTNET_TEST_VENV="$VENV" dotnet test tests/PyDotNet.Lifecycle.Tests -c Release --no-build \
            -- --treenode-filter "/*/*/VirtualEnvironmentActivation/*"

      - name: Test interpreter isolation
        shell: bash
        env:
          PYDOTNET_TEST_ISOLATION: "1"
        run: |
          dotnet test tests/PyDotNet.Lifecycle.Tests -c Release --no-build \
            -- --treenode-filter "/*/*/IsolationActivation/*"

      # sys.path placement, discovered the same way as in the main matrix job. The
      # prerelease job carried the venv and isolation gated steps but not this one, so
      # neither placement was exercised against upcoming Python versions.
      - name: Test sys.path placement
        shell: bash
        env:
          PYDOTNET_TEST_SYSPATH: "1"
        run: |
          cd tests/PyDotNet.Lifecycle.Tests

          TESTS=$(dotnet run -c Release --no-build -f net10.0 -- \
                    --list-tests --treenode-filter "/*/*/SysPathPlacementTests/*" \
                  | sed -n 's/^  \([A-Za-z_][A-Za-z0-9_]*\)$/\1/p')

          if [ -z "$TESTS" ]; then
            echo "::error::Discovered no SysPathPlacementTests. The filter or the class name has changed."
            exit 1
          fi

          for test in $TESTS; do
            echo "--- $test ---"
            dotnet test -c Release --no-build -- --treenode-filter "/*/*/SysPathPlacementTests/$test"
          done

  # Free-threaded (no-GIL) CPython, which the requirements table advertises as supported.
  # Until now nothing exercised it: PyRuntime.DetectGilEnabled existed but the only test
  # asserted IsGilEnabled == true, which is the standard-build answer.
  #
  # Kept out of the matrix and non-blocking for the same reason as the 3.15 job: wheels for
  # free-threaded builds lag, so the plugin test projects cannot run. The lifecycle suite
  # needs only the standard library, and it is what covers the runtime differences —
  # including the GIL detection this job exists to verify.
  free-threaded:
    runs-on: ubuntu-latest
    name: Build - Python 3.14 free-threaded (informational)
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Set up free-threaded Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14t'
          update-environment: true

      - name: Confirm this really is a free-threaded build
        shell: bash
        run: |
          python -VV
          # Guards against setup-python silently falling back to a standard build, which
          # would leave this job green while testing nothing it was added to test.
          python - <<'PY'
          import sys, sysconfig
          free_threaded = bool(sysconfig.get_config_var("Py_GIL_DISABLED"))
          print(f"Py_GIL_DISABLED={free_threaded}  sys._is_gil_enabled()={sys._is_gil_enabled()}")
          if not free_threaded:
              raise SystemExit("::error::Expected a free-threaded interpreter, got a standard build.")
          PY

      - name: Build
        shell: bash
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Test interpreter lifecycle
        shell: bash
        run: |
          dotnet test tests/PyDotNet.Lifecycle.Tests -c Release --no-build

  # Windows on ARM64, which the requirements table claims but nothing tested.
  #
  # Informational rather than part of the matrix, for the same reason as Intel macOS:
  # pyarrow and torch publish no win_arm64 wheels, so the plugin test projects cannot run
  # and a single pip install of the full set would fail the job outright. numpy, pandas and
  # matplotlib do have wheels, so that gap may close on its own.
  #
  # The lifecycle suite needs only the standard library, and it covers what actually differs
  # between platforms: locating libpython, loading it, and configuring the interpreter.
  windows-arm:
    runs-on: windows-11-arm
    name: Build - Windows arm64 (informational)
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          update-environment: true

      - name: Report interpreter and wheel availability
        shell: bash
        run: |
          python -VV
          python -c "import platform; print('machine:', platform.machine())"
          python -m pip install --upgrade pip

          for pkg in numpy pandas matplotlib pyarrow torch; do
            if timeout 90 python -m pip install --only-binary=:all: --dry-run --quiet "$pkg" 2>/dev/null; then
              echo "  available  $pkg"
            else
              echo "  missing    $pkg (no win_arm64 wheel yet)"
            fi
          done

      - name: Build
        shell: bash
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Test interpreter lifecycle
        shell: bash
        run: |
          dotnet test tests/PyDotNet.Lifecycle.Tests -c Release --no-build

      - name: Test virtual environment activation
        shell: bash
        run: |
          VENV="${RUNNER_TEMP}/pydotnet-test-venv"
          python -m venv "$VENV"
          SITE_PACKAGES=$("$VENV/Scripts/python.exe" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "MARKER = 'pydotnet'" > "$SITE_PACKAGES/pydotnet_venv_marker.py"

          if python -c "import pydotnet_venv_marker" 2>/dev/null; then
            echo "::error::Marker module leaked into the base interpreter; the test would prove nothing."
            exit 1
          fi

          PYDOTNET_TEST_VENV="$VENV" dotnet test tests/PyDotNet.Lifecycle.Tests -c Release --no-build \
            -- --treenode-filter "/*/*/VirtualEnvironmentActivation/*"
