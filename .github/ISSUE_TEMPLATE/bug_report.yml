name: Bug report
description: Something in PyDotNet does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most PyDotNet problems come down to *which interpreter actually got loaded*, so the
        environment questions below matter more than they usually would.

        For a security problem, please use
        [private vulnerability reporting](https://github.com/zcsizmadia/PyDotNet/security/advisories/new)
        instead of this form.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead. Include the exception and stack trace if there is one.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest code that shows the problem — both the C# and any Python it runs.
      render: csharp
    validations:
      required: true

  - type: textarea
    id: diagnostics-report
    attributes:
      label: Diagnostics report
      description: |
        Output of `PyRuntime.WriteDiagnosticsReport(Console.Out);` — it works even when
        `Initialize` failed, which is often the interesting case.

        This records the interpreter that was actually resolved — library path, version,
        `sys.path` in search order, `sys.prefix` against `sys.base_prefix`, and the
        isolation flags. It answers most of what a maintainer would otherwise have to ask
        for one question at a time.

        `dotnet run --project samples/PyDotNet.Sample.Doctor` prints the same report if it
        is easier to run than to add a call.
      placeholder: |
        PyDotNet diagnostics report
        ===========================

        Runtime
          State                    Running
          Python                   3.14.4
          Library                  /usr/lib/libpython3.14.so
        ...
      render: text
    validations:
      required: false

  - type: input
    id: pydotnet-version
    attributes:
      label: PyDotNet version
      placeholder: "1.2.0"
    validations:
      required: true

  - type: dropdown
    id: tfm
    attributes:
      label: Target framework
      options: ["net8.0", "net9.0", "net10.0", "other"]
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      placeholder: "Windows 11 x64 / Ubuntu 24.04 arm64 / macOS 15 Apple Silicon"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and how it was installed
      description: Whether it is a free-threaded build, and whether a virtual environment is involved.
      placeholder: "3.14.4, python.org installer, standard GIL build, using a venv"
    validations:
      required: true
